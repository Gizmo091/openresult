# openresult.dev
#
# nginx terminates TLS and hands everything to the Node service on loopback.
# It deliberately serves nothing itself: the application already knows which
# responses may be cached, which must not be, and what security headers each
# one carries. Two places deciding that is how they end up disagreeing.

upstream openresult_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

# Rate limits sized for a site that renders documents people post. Generous for
# a reader, and a nuisance for anything trying to use the URL fetcher as a
# proxy.
limit_req_zone $binary_remote_addr zone=openresult_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=openresult_fetch:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name openresult.dev www.openresult.dev;

    # Certbot writes its challenge here; everything else goes to TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://openresult.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openresult.dev;

    ssl_certificate     /etc/letsencrypt/live/openresult.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openresult.dev/privkey.pem;
    include /etc/nginx/openresult-tls.conf;
    ssl_trusted_certificate /etc/letsencrypt/live/openresult.dev/chain.pem;

    # One canonical host, so links and the schema `$id` agree with the address bar.
    return 301 https://openresult.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openresult.dev;

    ssl_certificate     /etc/letsencrypt/live/openresult.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openresult.dev/privkey.pem;
    include /etc/nginx/openresult-tls.conf;
    ssl_trusted_certificate /etc/letsencrypt/live/openresult.dev/chain.pem;

    # A posted document is a whole results sheet; the application enforces its
    # own 4 MB ceiling and answers 413 with an explanation, so leave it room to
    # do that rather than cutting the connection here.
    client_max_body_size 5m;
    client_body_timeout 15s;

    # Compression matters here: the specification is 48 kB of HTML and the
    # examples are JSON.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/markdown;
    gzip_min_length 1024;
    gzip_vary on;

    access_log /var/log/nginx/openresult.access.log;
    error_log  /var/log/nginx/openresult.error.log;

    location /api/fetch {
        limit_req zone=openresult_fetch burst=5 nodelay;
        proxy_pass http://openresult_app;
        include /etc/nginx/openresult-proxy.conf;
        # The upstream fetches a remote document, which can legitimately take a
        # few seconds.
        proxy_read_timeout 20s;
    }

    location / {
        limit_req zone=openresult_general burst=40 nodelay;
        proxy_pass http://openresult_app;
        include /etc/nginx/openresult-proxy.conf;
        proxy_read_timeout 15s;
    }
}
