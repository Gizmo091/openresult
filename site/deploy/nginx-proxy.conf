# Shared proxy settings for openresult.dev.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_send_timeout 15s;
# proxy_read_timeout is set per location: the URL fetcher legitimately waits
# longer than a page request should. nginx rejects a duplicate directive in one
# context, so it cannot also live here.
