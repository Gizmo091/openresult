# TLS settings for openresult.dev.
#
# Written here rather than pulled from certbot's generated file, so that what
# the server negotiates is visible in this repository and changes with review.
#
# TLS 1.2 is kept because some corporate proxies still stop there, and this site
# publishes a schema that build tooling fetches. TLS 1.0 and 1.1 are not.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_session_timeout 1d;
ssl_session_cache shared:OpenResultTLS:10m;
# Off, because a resumed session cannot have forward secrecy unless the ticket
# keys are rotated, and nothing here rotates them.
ssl_session_tickets off;

ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 9.9.9.9 valid=300s;
resolver_timeout 5s;
