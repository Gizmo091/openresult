name: release

on:
  push:
    tags:
      - 'v*'

# Publishing with provenance requires this token; nothing else here needs write
# access to the repository.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first. Everything below reads what it produces: the repository
      # checks measure the built bundle, the conformance runner imports it, and
      # the site's tests serve `site/dist`. `check.yml` learned this the hard
      # way; this file had the same ordering and nobody saw it, because it only
      # runs on a tag.
      - name: Build
        run: pnpm build

      # A release that has not passed the invariants and the conformance suite
      # is not a release. Publishing is irreversible on npm: a bad version can
      # be deprecated but never withdrawn.
      - name: Repository checks
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Conformance suite
        run: pnpm conformance

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Install a npm that speaks OIDC
        run: npm install -g npm@latest

      # Two tools, each doing what it is good at.
      #
      # pnpm packs: it is the only one that knows this is a workspace, and it
      # rewrites `workspace:*` into the real version on the way into the
      # tarball. npm publishes: it is the only one that speaks OIDC, which pnpm
      # still does not (pnpm#9812), and OIDC is what replaces the long-lived
      # token this workflow used to carry.
      #
      # Packages are named one by one rather than globbed. A glob over
      # `sdk/js/packages/*` once omitted the viewer, which lives elsewhere and
      # is the package a consumer is most likely to want, and included the
      # conformance runner, whose cases live at the repository root and would
      # not travel with it.
      - name: Pack
        run: |
          mkdir -p /tmp/tarballs
          for package in @openresult/core @openresult/validate @openresult/viewer @openresult/cli; do
            pnpm --filter "$package" exec pnpm pack --pack-destination /tmp/tarballs
          done
          ls -la /tmp/tarballs

      # No token: the id-token permission above lets npm exchange a
      # short-lived, signed OIDC assertion for publish rights, and provenance
      # comes with it. Each package must have this repository and this workflow
      # filename registered as a trusted publisher on npmjs.com.
      - name: Publish
        run: |
          for tarball in /tmp/tarballs/*.tgz; do
            echo "Publishing $tarball"
            npm publish "$tarball" --access public --provenance
          done
