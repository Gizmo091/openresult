name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first. Everything below needs the packages' emitted declarations:
      # typecheck resolves @openresult/core through them, the repository checks
      # measure the built bundle, and the conformance runner imports it. A local
      # tree usually has a stale dist lying around, which is exactly why this
      # ordering error survived eleven green local runs and eleven red CI runs.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # Repository invariants. Each of these enforces a project principle that
      # would otherwise be a mere intention: dependency-free core, no
      # domain-specific logic in consumers, spec/schema/examples agreement,
      # optional presentation layer, and normative rule coverage.
      - name: Repository checks
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Conformance suite
        run: pnpm conformance
